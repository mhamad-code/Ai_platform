name: Deploy Gateway (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/gateway.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Create D1 database if missing and patch wrangler.jsonc
        run: |
          get_id() {
            npx wrangler d1 list --json | jq -r '.[] | select(.name=="ai-platform-gateway") | .uuid'
          }
          ID=$(get_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create ai-platform-gateway
            ID=$(get_id)
          fi
          echo "D1 id: $ID"
          sed -i "s/\"database_id\": \"local\"/\"database_id\": \"$ID\"/" wrangler.jsonc

      - name: Apply schema
        run: npx wrangler d1 execute ai-platform-gateway --remote --file schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy src/index.ts

      - name: Set Worker secrets
        run: |
          echo -n "${{ secrets.GATEWAY_SECRET }}" | npx wrangler secret put GATEWAY_SECRET
          echo -n "https://mhamad-code.github.io" | npx wrangler secret put ALLOWED_ORIGIN
          echo -n "https://mhamad-code.github.io/Ai_platform" | npx wrangler secret put APP_ORIGIN
          echo -n "ai-platform-204e3" | npx wrangler secret put FIREBASE_PROJECT_ID
